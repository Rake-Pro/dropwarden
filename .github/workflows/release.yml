# Release: a promotion PR merging dev into main mints the next semver tag
# (patch by default; label the PR release:minor or release:major to change the
# bump) and builds from it in this same run - a tag pushed with GITHUB_TOKEN
# cannot trigger another workflow, so nothing is chained. A vX.Y.Z tag pushed
# by hand, or a manual dispatch naming an existing tag, takes the same path.
#
# The run builds and packages dropwarden for Windows, macOS and Linux
# (desktop.yml), builds the container image, attaches the desktop assets to a
# GitHub Release and writes the updater manifest (latest.json) next to them;
# the in-app updater (internal/update) reads releases/latest/download/latest.json.
# When DOWNLOADS_BASE_URL and DOWNLOADS_UPLOAD_TOKEN are set the assets are
# also mirrored to a downloads host. Asset names must stay in sync with
# update.AssetName().
#
# Artifact matrix:
#   Windows  dropwarden_<ver>_windows_amd64_setup.exe  (Inno Setup, per-user)
#            dropwarden_<ver>_windows_amd64.zip        (updater feed, loose exes)
#   macOS    dropwarden_<ver>_darwin_universal.dmg     (human install)
#            dropwarden_<ver>_darwin_universal.zip     (updater feed, whole .app)
#   Linux    dropwarden_<ver>_linux_amd64.tar.gz       (both binaries; updater feed too)
#   checksums.txt  (sha256 of every asset)
#   latest.json    (updater manifest, stable channel; see README "Releasing")
#   container      ghcr.io/rake-pro/dropwarden:vX.Y.Z (deploy/container/Dockerfile)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to build and publish (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write # push the minted tag, create the GitHub release
  pull-requests: read # the merged PR's labels choose the bump level
  packages: write # push the container image

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.2"
  VERSION_PKG: github.com/rake-pro/dropwarden/internal/version.Version

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      skip: ${{ steps.v.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Branch push (promotion merge): mint the next tag from the merged PR's
      # labels and push it. Tag push / dispatch: use the named tag.
      - name: Resolve or mint tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
              echo "HEAD already tagged; nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "${latest}" ]; then
              tag="v0.1.0"
            else
              labels=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                --jq '[.[].labels[].name] | join(",")' || echo "")
              bump=patch
              case ",${labels}," in
                *,release:major,*) bump=major ;;
                *,release:minor,*) bump=minor ;;
              esac
              IFS=. read -r ma mi pa <<< "${latest#v}"
              case "${bump}" in
                major) tag="v$((ma+1)).0.0" ;;
                minor) tag="v${ma}.$((mi+1)).0" ;;
                patch) tag="v${ma}.${mi}.$((pa+1))" ;;
              esac
            fi
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
            echo "minted ${tag} at ${GITHUB_SHA}"
          fi
          # vX.Y.Z publishes everywhere; vX.Y.Z-rc.N is a GitHub-only
          # pre-release (releases/latest skips it, so installed apps never see it).
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "tag '${tag}' is not vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
          pre=false
          [[ "${tag}" == *-rc.* ]] && pre=true
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${pre}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: refs/tags/${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # Container image for the tag (deploy/container/Dockerfile) -> GHCR, tagged
  # with the git tag only (no :latest). The dev channel's images come from
  # ci.yml as dev-<sha>; container.yml rebuilds an existing tag on demand.
  image:
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/rake-pro/dropwarden
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same gate as the other image repos: CRITICAL blocks, HIGH is reported.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, desktop]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      DOWNLOADS_BASE_URL: ${{ vars.DOWNLOADS_BASE_URL }}
      DOWNLOADS_UPLOAD_TOKEN: ${{ secrets.DOWNLOADS_UPLOAD_TOKEN }}
    steps:
      # The workflow's own ref, not the tag: CHANGELOG.md and the scripts are
      # read from the commit this run was started on, so a release whose
      # changelog section was stamped after the tag can still be published by
      # dispatching this workflow on that branch. The assets were built from
      # the tag by the desktop and image jobs.
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: "{windows,macos,linux}"
          merge-multiple: true

      # Release notes = this version's CHANGELOG.md section, verbatim. They
      # are the body of the GitHub release AND the "notes" the in-app
      # What's new dialog renders from latest.json, so the changelog is the
      # single source; nothing links back to GitHub (the repo is private).
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/changelog-notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Checksums
        run: |
          cd assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create or update release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            pre=""
            [ "${PRERELEASE}" = "true" ] && pre="--prerelease"
            gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" $pre \
              --title "dropwarden $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # Updater manifest: every asset with its absolute URL on the downloads
      # host, sha256 and size, plus the release notes. A versioned asset the
      # host already serves is immutable there (a re-run's rebuild is not
      # byte-identical), so the manifest hashes the HOSTED bytes for those,
      # or the feed would name a sha256 the updater can never verify.
      - name: Write latest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download"
          tag, version = os.environ["TAG"], os.environ["VERSION"]
          notes = open(os.path.join(os.environ["RUNNER_TEMP"], "notes.md"), encoding="utf-8").read().strip()
          assets = []
          for name in sorted(os.listdir("assets")):
              if name == "latest.json":
                  continue
              data = open(os.path.join("assets", name), "rb").read()
              assets.append({
                  "name": name,
                  "url": f"{base}/{tag}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          manifest = {
              "name": "dropwarden",
              "version": version,
              "tag": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": notes,
              "assets": assets,
          }
          with open("assets/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat assets/latest.json
          gh release upload "$TAG" assets/latest.json --repo "$GITHUB_REPOSITORY" --clobber

      # Optional mirror. Contract for the receiving service: PUT with a Bearer
      # token, layout <base>/dropwarden/<tag>/<asset> plus
      # <base>/dropwarden/latest.json (the manifest still names the GitHub asset
      # URLs). latest.json goes last so the feed never names files not yet there.
      - name: Mirror to downloads host
        if: env.DOWNLOADS_UPLOAD_TOKEN != '' && env.DOWNLOADS_BASE_URL != '' && needs.version.outputs.prerelease != 'true'
        run: |
          set -euo pipefail
          base="${DOWNLOADS_BASE_URL%/}"
          for f in assets/*; do
            name=$(basename "$f")
            # Versioned assets are served as immutable: a re-run of the tag
            # must never overwrite one. latest.json and checksums.txt always go.
            if [ "$name" != "latest.json" ] && [ "$name" != "checksums.txt" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer ${DOWNLOADS_UPLOAD_TOKEN}" \
                "${base}/dropwarden/${TAG}/${name}" || true)
              if [ "$code" = "200" ]; then
                echo "${base}/dropwarden/${TAG}/${name} exists, skipping"
                continue
              fi
            fi
            echo "PUT ${base}/dropwarden/${TAG}/${name}"
            curl --fail -sS -X PUT -H "Authorization: Bearer ${DOWNLOADS_UPLOAD_TOKEN}" \
              --data-binary "@${f}" "${base}/dropwarden/${TAG}/${name}"
          done
          echo "PUT ${base}/dropwarden/latest.json"
          curl --fail -sS -X PUT -H "Authorization: Bearer ${DOWNLOADS_UPLOAD_TOKEN}" \
            --data-binary "@assets/latest.json" "${base}/dropwarden/latest.json"
