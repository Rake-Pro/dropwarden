name: Sync to main

on:
  push:
    branches: [dev]
  # Fallback: catches any push event GitHub suppressed (bot-token merges) or a
  # failed earlier run. Worst case a promotion PR shows up a day late.
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open promotion PR if dev is ahead of main
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          if ! gh api "repos/${repo}/branches/main" --silent 2>/dev/null; then
            echo "No main branch; nothing to sync."
            exit 0
          fi

          ahead=$(gh api "repos/${repo}/compare/main...dev" --jq .ahead_by)
          if [ "${ahead}" -eq 0 ]; then
            echo "main is up to date with dev."
            exit 0
          fi

          open=$(gh pr list --repo "${repo}" --base main --head dev --state open --json number --jq length)
          if [ "${open}" -gt 0 ]; then
            echo "Promotion PR already open; it tracks dev automatically."
            exit 0
          fi

          gh pr create --repo "${repo}" \
            --base main --head dev \
            --title "Merge dev to main" \
            --body "$(printf 'Automated promotion PR: dev is %s commit(s) ahead of main.\n\nMerging (merge commit) mints the next patch release and builds the image. Label with release:minor or release:major before merging to change the version bump.' "${ahead}")"
