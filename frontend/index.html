<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dropwarden</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#ffd685" d="M3 10V8.5A5.5 5.5 0 0 1 8.5 3h7A5.5 5.5 0 0 1 21 8.5V10Z"/><path fill="#f2b24e" d="M3 12h18v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5Z"/><rect x="10" y="8.6" width="4" height="6.4" rx="1.2" fill="#7a4c14"/><circle cx="12" cy="11.4" r="1.1" fill="#ffd685"/></svg></span> dropwarden</div>
    <div class="nav active" data-view="dashboard" role="button" tabindex="0"><span class="ic">◧</span> Dashboard</div>
    <div class="nav" data-view="queue" role="button" tabindex="0"><span class="ic">≡</span> Queue</div>
    <div class="nav" data-view="history" role="button" tabindex="0"><span class="ic">🎁</span> History</div>
    <div class="grp">Setup</div>
    <div class="nav" data-view="settings" role="button" tabindex="0"><span class="ic">⚙</span> Settings</div>
    <div class="nav" data-view="debug" role="button" tabindex="0"><span class="ic">🐞</span> Debugging</div>
    <div class="foot" id="rail-foot"><div class="frow"><span class="fdot warn"></span>Connecting…</div></div>
  </nav>
  <main class="content" id="content">
    <section class="view active" data-view="dashboard" id="v-dashboard"></section>
    <section class="view" data-view="queue" id="v-queue"></section>
    <section class="view" data-view="history" id="v-history"></section>
    <section class="view" data-view="settings" id="v-settings"></section>
    <section class="view" data-view="debug" id="v-debug"></section>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
