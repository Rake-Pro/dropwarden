<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dropwarden</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand">
      <button class="rail-toggle" id="rail-toggle" type="button" aria-label="Menu" aria-expanded="false"><span data-icon="menu"></span></button>
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#ffd685" d="M3 10V8.5A5.5 5.5 0 0 1 8.5 3h7A5.5 5.5 0 0 1 21 8.5V10Z"/><path fill="#f2b24e" d="M3 12h18v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5Z"/><rect x="10" y="8.6" width="4" height="6.4" rx="1.2" fill="#7a4c14"/><circle cx="12" cy="11.4" r="1.1" fill="#ffd685"/></svg></span>
      <span class="bname">dropwarden</span>
    </div>
    <button class="nav active" data-view="dashboard" type="button" aria-current="page" title="Dashboard"><span class="ic" data-icon="dashboard"></span><span class="lbl">Dashboard</span></button>
    <button class="nav" data-view="queue" type="button" title="Queue"><span class="ic" data-icon="queue"></span><span class="lbl">Queue</span></button>
    <button class="nav" data-view="history" type="button" title="History"><span class="ic" data-icon="gift"></span><span class="lbl">History</span></button>
    <div class="grp">Setup</div>
    <button class="nav" data-view="settings" type="button" title="Settings"><span class="ic" data-icon="gear"></span><span class="lbl">Settings</span></button>
    <button class="nav" data-view="debug" type="button" title="Debugging"><span class="ic" data-icon="bug"></span><span class="lbl">Debugging</span></button>
    <div class="foot" id="rail-foot"><div class="frow"><span class="fdot warn"></span><span class="ftxt">Connecting...</span></div></div>
  </nav>
  <main class="content" id="content">
    <section class="view active" data-view="dashboard" id="v-dashboard"></section>
    <section class="view" data-view="queue" id="v-queue"></section>
    <section class="view" data-view="history" id="v-history"></section>
    <section class="view" data-view="settings" id="v-settings"></section>
    <section class="view" data-view="debug" id="v-debug"></section>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
