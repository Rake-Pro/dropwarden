version: "3"

# dropwarden task runner. The GUI app (cmd/dropwarden) targets Windows, macOS,
# and Linux. On Windows/macOS `wails3 dev` gives HMR. Linux uses Wails' GTK3
# backend (build tag gtk3 -> GTK3 + webkit2gtk-4.1, the most portable stack);
# the gtk3 tag is inert on other platforms, so every Go command passes it.
# When the GTK dev stack lives in a user sysroot (containerized builds), source
# the sysroot env file first (real Linux machines just install
# libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev). The CLI harness
# (cmd/dropwarden-cli) runs everywhere with no cgo.

vars:
  GOTMPDIR:
    sh: go env GOTMPDIR
  # Version stamped into local release-style builds; override with
  # `task build-gui-win VERSION=0.1.0`. Releases stamp it in release.yml.
  VERSION: '{{.VERSION | default "0.0.0-dev"}}'
  VERSION_LDFLAG: -X github.com/rake-pro/dropwarden/internal/version.Version={{.VERSION}}

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Run all unit tests
    cmds:
      - go test -tags gtk3 ./...

  vet:
    desc: go vet
    cmds:
      - go vet -tags gtk3 ./...

  fmt-check:
    desc: Verify gofmt cleanliness
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  build:
    desc: Build the CLI harness
    cmds:
      - go build -o bin/dropwarden-cli ./cmd/dropwarden-cli

  build-win:
    desc: Cross-compile check of the GUI for Windows (CGO-free)
    cmds:
      - GOOS=windows go build ./...

  build-gui-win:
    desc: Build the Windows GUI into dist/windows (CGO-free, production, no console window)
    cmds:
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production -ldflags "-H windowsgui {{.VERSION_LDFLAG}}" -o dist/windows/dropwarden.exe ./cmd/dropwarden

  build-cli-win:
    desc: Build the Windows CLI (also the self-updater's helper) into dist/windows
    cmds:
      - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "{{.VERSION_LDFLAG}}" -o dist/windows/dropwarden-cli.exe ./cmd/dropwarden-cli

  icons:
    desc: Regenerate build/icons (app PNG, Windows ico, tray PNG) from the logo; needs Python 3 + Pillow
    cmds:
      - python3 scripts/gen-icons.py

  build-linux:
    desc: Build the Linux GUI (GTK3 backend; needs GTK dev stack or the container sysroot env)
    cmds:
      - go build -tags gtk3 -o bin/dropwarden ./cmd/dropwarden

  check:
    desc: fmt-check + vet + test + windows build + forbidden-call scan
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: build-win
      - task: forbidden

  forbidden:
    desc: Guard against focus-stealing browser calls sneaking in
    cmds:
      # bringToFront is banned outright, everywhere.
      - |
        if grep -rn --include=*.go -E "bringToFront" internal/browser internal/twitch internal/watcher; then
          echo "forbidden focus-stealing call found: bringToFront"; exit 1
        fi
      # Tab activation is allowed in EXACTLY ONE audited call site:
      # internal/browser/window.go, the shared-window coordinator. Design
      # decision 2026-08-30 accepts it as the proof-of-concept mechanism for
      # one-Chrome-window-per-profile; the GitHub issues track replacing it. The ban stands everywhere
      # else - do not widen this exemption.
      - |
        if grep -rn --include=*.go -E "\.Activate\(" internal/browser internal/twitch internal/watcher \
             | grep -v '^internal/browser/window\.go:'; then
          echo "forbidden focus-stealing call found outside internal/browser/window.go"; exit 1
        fi

  # ---- GUI (run on Windows/macOS) ----
  generate:
    desc: Generate Wails bindings (run on Windows/macOS with wails3 installed)
    cmds:
      - wails3 generate bindings -d frontend/bindings

  dev:
    desc: Run the GUI with hot reload (Windows/macOS; needs wails3)
    cmds:
      - wails3 dev

  # ---- CLI convenience ----
  doctor:
    cmds:
      - go run ./cmd/dropwarden-cli doctor
  login:
    cmds:
      - go run ./cmd/dropwarden-cli login
  discover:
    cmds:
      - go run ./cmd/dropwarden-cli discover
  watch:
    cmds:
      - go run ./cmd/dropwarden-cli watch
  report:
    cmds:
      - go run ./cmd/dropwarden-cli report
