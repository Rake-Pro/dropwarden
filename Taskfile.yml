version: "3"

# dropwarden task runner. The GUI app (cmd/dropwarden) targets Windows, macOS,
# and Linux. On Windows/macOS `wails3 dev` gives HMR. Linux uses Wails' GTK3
# backend (build tag gtk3 -> GTK3 + webkit2gtk-4.1, the most portable stack);
# the gtk3 tag is inert on other platforms, so every Go command passes it.
# In claude-container the GTK dev stack lives in a user sysroot: source
# ~/tools/wails-sysroot.env first (real Linux machines just install
# libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev). The CLI harness
# (cmd/dropwarden-cli) runs everywhere with no cgo.

vars:
  GOTMPDIR:
    sh: go env GOTMPDIR

tasks:
  default:
    cmds:
      - task --list

  test:
    desc: Run all unit tests
    cmds:
      - go test -tags gtk3 ./...

  vet:
    desc: go vet
    cmds:
      - go vet -tags gtk3 ./...

  fmt-check:
    desc: Verify gofmt cleanliness
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  build:
    desc: Build the CLI harness
    cmds:
      - go build -o bin/dropwarden-cli ./cmd/dropwarden-cli

  build-win:
    desc: Cross-compile check of the GUI for Windows (CGO-free)
    cmds:
      - GOOS=windows go build ./...

  build-linux:
    desc: Build the Linux GUI (GTK3 backend; needs GTK dev stack or the container sysroot env)
    cmds:
      - go build -tags gtk3 -o bin/dropwarden ./cmd/dropwarden

  check:
    desc: fmt-check + vet + test + windows build + forbidden-call scan
    cmds:
      - task: fmt-check
      - task: vet
      - task: test
      - task: build-win
      - task: forbidden

  forbidden:
    desc: Guard against focus-stealing browser calls sneaking in
    cmds:
      - |
        if grep -rn --include=*.go -E "bringToFront|\.Activate\(" internal/browser internal/twitch internal/watcher; then
          echo "forbidden focus-stealing call found"; exit 1
        fi

  # ---- GUI (run on Windows/macOS) ----
  generate:
    desc: Generate Wails bindings (run on Windows/macOS with wails3 installed)
    cmds:
      - wails3 generate bindings -d frontend/bindings

  dev:
    desc: Run the GUI with hot reload (Windows/macOS; needs wails3)
    cmds:
      - wails3 dev

  # ---- CLI convenience ----
  doctor:
    cmds:
      - go run ./cmd/dropwarden-cli doctor
  login:
    cmds:
      - go run ./cmd/dropwarden-cli login
  discover:
    cmds:
      - go run ./cmd/dropwarden-cli discover
  watch:
    cmds:
      - go run ./cmd/dropwarden-cli watch
  report:
    cmds:
      - go run ./cmd/dropwarden-cli report
